[project]
name = "production-ready-nl2sql-backend"
version = "0.1.0"
description = "FastAPI backend service built on production-ready-backend-core."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.121,<1.0",
  "starlette>=1.0.1,<2.0",
  "uvicorn[standard]>=0.37",
  "gunicorn>=23,<24",
  "pydantic>=2.11",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.1",
  "python-multipart>=0.0.20",
  "httpx==0.28.1",
  "python-json-logger>=4.0",
  "charset-normalizer>=3.4",
  "prometheus-client>=0.24",
  "production-ready-backend-core",
  "production-ready-system-settings-backend",
  "oci>=2.160",
  "oracledb>=3.4",
  "scikit-learn>=1.7",
  "joblib>=1.5",
  "openpyxl>=3.1",
  "xlrd>=2.0.2,<3",
  "pypdf>=6.19.0",
  "pypdfium2>=4.30",
  "pillow>=11.0",
  "python-docx>=1.2",
  "rdflib>=7.1",
  "pyshacl>=0.30",
  "sqlglot>=27",
  "pwdlib[argon2]>=0.3,<1.0",
  "cryptography>=50.0.0",
  "jsonschema>=4.23",
]

[project.scripts]
nl2sql-system-schema = "app.cli.nl2sql_system_schema:main"
nl2sql-job-worker = "app.cli.nl2sql_job_worker:main"
nl2sql-schema-refresh-worker = "app.cli.nl2sql_schema_refresh_worker:main"
nl2sql-config-audit = "app.cli.config_audit:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.8",
  "pytest-timeout>=2.3",
  "ruff>=0.9",
  "mypy>=1.14",
  "bandit>=1.8",
  "pip-audit>=2.9",
  "types-jsonschema>=4.23",
]

[tool.uv.sources]
# テンプレを <app>/backend へ展開したときの相対パス。
production-ready-backend-core = { path = "../../platform/packages/backend_core", editable = true }
production-ready-system-settings-backend = { path = "../../platform/packages/system_settings_backend", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# 整形（#345）。black と同じ既定（二重引用符・空白の字下げ・magic trailing comma を尊重）にそろえる。
# 行の長さは [tool.ruff] の line-length を共有する。
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# 1 つのテストが止まったら 120 秒で失敗にし、stack を出す（pytest-timeout。#1591）。job の上限（15 分）まで
# 待たない。遅いテストは `@pytest.mark.timeout(<秒>)` で個別に延ばす。
timeout = 120
