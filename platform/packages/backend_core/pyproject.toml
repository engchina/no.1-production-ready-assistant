[project]
name = "production-ready-backend-core"
version = "0.2.0"
description = "Shared FastAPI infrastructure (app factory, settings base, JSON logging, health/ready, metrics, request-context, error envelope, pagination, CORS) for the No.1 Production Ready product family (RAG / NL2SQL / Agent)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.121,<1.0",
  "starlette>=1.0.1,<2.0",
  "pydantic>=2.11",
  "pydantic-settings>=2.7",
  "python-json-logger>=4.0",
  "prometheus-client>=0.24",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[dependency-groups]
dev = [
  "uvicorn>=0.37",
  "httpx==0.28.1",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "pytest-xdist>=3.8",
  "pytest-timeout>=2.3",
  # pr_backend_core.spreadsheet のテスト（Excel の読み方。使う側が依存に入れる。#2525）
  "openpyxl>=3.1,<4",
  "xlrd>=2.0,<3",
  "xlwt>=1.3,<2",  # .xls の見本をテストの中で作る
  "ruff>=0.9",
  "mypy>=1.14",
  "bandit>=1.8",
  "pip-audit>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_backend_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# 整形（#345）。black と同じ既定（二重引用符・空白の字下げ・magic trailing comma を尊重）にそろえる。
# 行の長さは [tool.ruff] の line-length を共有する。
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Excel の読み取り（pr_backend_core.spreadsheet）が関数の中で読む、型の無いライブラリ。
[[tool.mypy.overrides]]
module = ["openpyxl.*", "xlrd.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
# 1 つのテストが止まったら 120 秒で失敗にし、stack を出す（pytest-timeout。#1591）。job の上限（15 分）まで
# 待たない。遅いテストは `@pytest.mark.timeout(<秒>)` で個別に延ばす。
timeout = 120
