# HTTP context。ログインの API（/api/auth/login）だけに使う、送信元 IP ごとの緩い上限（#1173）。
# 回数の制限の正本は backend（PLATFORM_AUTH_LOGIN_*。3 製品・全 worker で共有して数える）。
# ここは、1 つの送信元からの大量の要求（429 の連打を含む）が、パスワードの照合や DB に届く前に
# Nginx で止めるための上限で、人の操作や NAT の後ろの多数の利用者のログインでは掛からない値にする。
# 3 製品の Nginx が同じ zone 名で読む（同じホストに複数の製品を置いても 1 つだけ定義される）。
limit_req_zone $binary_remote_addr zone=pr_login:10m rate=1r/s;
