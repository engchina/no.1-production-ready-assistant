# platform/deploy/suite-init.sh が /etc/nginx/nginx.conf に置く（手で編集しない）。#1611
# Oracle Linux 9 の nginx の package の nginx.conf（/etc/nginx/nginx.conf.default）から、既定の server
# （port 80 の server_name _ と /usr/share/nginx/html）だけを外したもの。suite の site
# （/etc/nginx/conf.d/production-ready-suite.conf）が公開の port の default_server になる。
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # suite の設定（production-ready-logging.conf・production-ready-login-rate-limit.conf・production-ready-suite.conf）。
    # 名前の順に読む（site が使う log_format と limit_req_zone を先に定義する）。
    include /etc/nginx/conf.d/*.conf;
}
