# HTTP context。query・body・IP・認証情報・具体的な resource ID は記録しない。
map $http_x_request_id $pr_request_id {
    default $request_id;
    "~^[A-Za-z0-9._:-]{1,128}$" $http_x_request_id;
}
# 1 台に 3 製品を置く配備（#1316）では、URI が製品の prefix（/rag /nl2sql /agent）で始まる。route は prefix を
# 除いた形にそろえ、製品は service_name で分ける。
map $uri $pr_route {
    default "/static/*";
    ~^(/(rag|nl2sql|agent))?/api/services/[^/]+/status$ "/api/services/{service_id}/status";
    ~^(/(rag|nl2sql|agent))?/api/mcp$ "/api/mcp";
    ~^(/(rag|nl2sql|agent))?/api/health$ "/api/health";
    ~^(/(rag|nl2sql|agent))?/api/ready$ "/api/ready";
    ~^(/(rag|nl2sql|agent))?/api/ "/api/*";
}
map "$request_method:$pr_route:$status" $pr_loggable {
    default 1;
    ~^GET:/api/services/\{service_id\}/status:2[0-9][0-9]$ 0;
}
map $status $pr_level {
    default "INFO";
    ~^4 "WARNING";
    ~^5 "ERROR";
}
log_format production_ready_json escape=json
    '{"schema_version":1,"timestamp_epoch":$msec,"level":"$pr_level",'
    '"name":"nginx.access","event":"http_access","message":"HTTP リクエスト",'
    '"component":"nginx","service_name":"$pr_service_name",'
    '"service_version":"0.1.0","environment":"production","process_id":$pid,'
    '"request_id":"$pr_request_id","http_method":"$request_method",'
    '"http_route":"$pr_route","http_status":$status,"duration_seconds":$request_time}';
