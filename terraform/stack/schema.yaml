title: "Deploy Production Ready Suite on Oracle Cloud Infrastructure"
stackDescription: "Deploy the selected Production Ready products (RAG / NL2SQL / Agent Control Plane) on OCI. One Oracle Autonomous AI Database (new or existing) and one Compute instance are shared by every selected product; Nginx serves them under /rag/, /nl2sql/ and /agent/ (HTTPS on port 443 with a private CA by default). Configure AI runtime settings after startup from each application's System Settings."
schemaVersion: 1.1.0
version: "20261008.1"
locale: "en"

variableGroups:
  - title: "配備先"
    visible: true
    variables:
      - compartment_ocid

  - title: Autonomous AI Database
    visible: true
    variables:
      - adb_compartment_ocid
      - adb_deployment_mode
      - adb_app_user_enabled

  - title: Existing Autonomous AI Database
    visible:
      eq:
        - adb_deployment_mode
        - "既存の Autonomous AI Database を選択"
    variables:
      - existing_adb_ocid
      - existing_adb_admin_password
      - existing_oracle_user
      - existing_oracle_password
      - existing_oracle_dsn

  - title: New Autonomous AI Database
    visible:
      eq:
        - adb_deployment_mode
        - "新規 Autonomous AI Database の作成"
    variables:
      - adb_display_name
      - adb_name
      - adb_workload
      - adb_db_version
      - adb_compute_count
      - adb_is_auto_scaling_enabled
      - adb_data_storage_size_in_tbs
      - adb_is_auto_scaling_for_storage_enabled
      - license_model
      - adb_backup_retention_period_in_days
      - adb_password

  - title: "ADB のネットワーク"
    visible:
      eq:
        - adb_deployment_mode
        - "新規 Autonomous AI Database の作成"
    variables:
      - adb_network_access_type
      - adb_private_endpoint_vcn_compartment_id
      - adb_private_endpoint_vcn_id
      - adb_private_endpoint_subnet_compartment_id
      - adb_subnet_id
      - adb_acl_notation_type
      - adb_acl_vcn_compartment_id
      - adb_acl_vcn_id
      - adb_acl_subnet_compartment_id
      - adb_acl_subnet_id
      - adb_acl_cidr_blocks

  - title: "アプリ用の DB ユーザー"
    visible: adb_app_user_enabled
    variables:
      - adb_app_user_name
      - adb_app_user_password

  - title: "主 Compute の構成"
    visible: true
    variables:
      - instance_display_name
      - instance_shape
      - instance_flex_shape_ocpus
      - instance_flex_shape_memory
      - instance_image_source_id
      - instance_boot_volume_size
      - instance_boot_volume_vpus

  - title: "主 Compute のネットワークと SSH"
    visible: true
    variables:
      - availability_domain
      - vcn_ai_vcn_id
      - subnet_ai_subnet_id
      - ssh_authorized_keys

  - title: "HTTPS"
    visible: true
    variables:
      - https_enabled
      - https_port
      - http_port

  - title: "Bastion"
    visible: true
    variables:
      - bastion_enabled

  - title: "bastion の構成"
    visible: bastion_enabled
    variables:
      - bastion_display_name
      - bastion_shape
      - bastion_flex_shape_ocpus
      - bastion_flex_shape_memory
      - bastion_image_source_id
      - bastion_boot_volume_size
      - bastion_boot_volume_vpus

  - title: "bastion のネットワークと接続"
    visible: bastion_enabled
    variables:
      - bastion_compartment_ocid
      - bastion_availability_domain
      - bastion_vcn_id
      - bastion_subnet_id
      - bastion_ssh_authorized_keys
      - bastion_vnc_password

  - title: "アプリケーション管理者"
    visible:
      or:
        - deploy_rag
        - deploy_nl2sql
        - deploy_agent
    variables:
      - app_admin_login_user_password

  - title: RAG
    visible: deploy_rag
    variables:
      - rag_enable_parser_unstructured

  - title: "配備する製品"
    visible: false
    variables:
      - deploy_rag
      - deploy_nl2sql
      - deploy_agent

  - title: "Hidden"
    visible: false
    variables:
      - region
      - adb_compute_model
      - application_git_url
      - application_git_ref
      - existing_oracle_wallet_password
      - adb_is_mtls_connection_required
      - platform_environment
      - app_admin_login_user_id
      - agent_runtime_repository_backend
      - adb_is_elastic_pool_enabled
      - adb_resource_pool_size
      - adb_resource_pool_storage_size_in_tbs
      - timezone

variables:
  region:
    title: Region
    type: oci:identity:region:name
    required: true
    visible: false
    default: "ap-osaka-1"

  compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    visible: true
    title: "Create in compartment"

  availability_domain:
    type: oci:identity:availabilitydomain:name
    required: true
    visible: true
    title: "Availability domain"
    dependsOn:
      region: ${region}
      compartmentId: ${compartment_ocid}

  vcn_ai_vcn_id:
    type: oci:core:vcn:id
    required: true
    visible: true
    title: "VCN"
    description: "Select an existing virtual cloud network."
    dependsOn:
      compartmentId: ${compartment_ocid}

  application_git_url:
    type: string
    required: true
    visible: false
    title: "Application Git URL"
    description: "Production Ready suite monorepo (rag/, nl2sql/, agent/, and platform/)."
    default: "https://github.com/engchina/no.1-production-ready-suite.git"

  application_git_ref:
    type: string
    required: true
    visible: false
    title: "Application Git ref"
    description: "Branch or tag to clone. The default deploys main."
    default: "main"



  https_enabled:
    type: boolean
    required: true
    visible: true
    title: "HTTPS（443）"
    description: "オンにすると、Nginx が https_port（既定 443）で HTTPS を受けます（80 は開けず、listen もしません）。証明書は Compute の中で作る自作の Root CA と、Compute の公開 IP・private IP の証明書です（発行者は固定）。ブラウザの警告を消すには、各製品の「システム設定 > 外観と証明書」から CA の証明書を取り込みます。オフにすると http_port（既定 80）の HTTP だけで配信します。subnet の security list（または NSG）で使う port の TCP を許可してください。"
    default: true

  https_port:
    type: number
    required: true
    visible: https_enabled
    title: "HTTPS port"
    description: "Nginx が HTTPS を受ける port（既定 443）。HTTPS が on のときはこの port だけを開けます。SSH（22）・よく使われる service の port・Compute の中で製品が使う port（3000 / 3001 / 3002 / 8000 / 8010 / 8020 / 18000〜18099 など）は使えません。subnet の security list（または NSG）でこの port の TCP を許可してください。"
    default: 443

  http_port:
    type: number
    required: true
    visible:
      not:
        - https_enabled
    title: "HTTP port"
    description: "HTTPS が off のときだけ使う、Nginx が HTTP を受ける port（既定 80）。HTTPS が on のときは開けず、listen もしません。SSH（22）・よく使われる service の port・Compute の中で製品が使う port（3000 / 3001 / 3002 / 8000 / 8010 / 8020 / 18000〜18099 など）は使えません。subnet の security list（または NSG）でこの port の TCP を許可してください。"
    default: 80

  adb_compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    visible: true
    title: "ADBのコンパートメント"
    description: "新規Autonomous AI Databaseの作成先、または既存Autonomous AI Databaseの候補を絞り込むコンパートメントを選択します。Computeのデプロイ先には影響しません。"
    default: compartment_ocid

  adb_deployment_mode:
    type: enum
    required: true
    visible: true
    title: "ADBの利用方法"
    description: "新規Autonomous AI Databaseを作成するか、選択したコンパートメント内の既存Autonomous AI Databaseを使用するかを選択します。"
    enum:
      - "新規 Autonomous AI Database の作成"
      - "既存の Autonomous AI Database を選択"
    default: "新規 Autonomous AI Database の作成"

  adb_app_user_enabled:
    type: boolean
    required: false
    visible: true
    title: "アプリ用の DB ユーザーを使う"
    description: "既定で有効（推奨）。Compute が配備のときに ADMIN で ADB に接続し、アプリ用のユーザー（ADMIN ではないユーザー）を作って権限（PDB_DBA）を付けます（既定の名前は ADB_APP_USER）。3 製品はこのユーザーで接続し、システムの表もこのユーザーの schema に作ります。ADMIN のパスワードは platform/.env に書きません。無効にすると、新規の ADB は ADMIN、既存の ADB は「Existing DB username」で接続します。"
    default: true

  existing_adb_ocid:
    type: oci:database:autonomousdatabase:id
    required: false
    visible: true
    title: "既存のAutonomous AI Database"
    description: "選択したコンパートメント内の既存ADBを選択します。TerraformがWalletを生成し、接続設定をplatform/.env（3製品共通の設定）へ反映します。"
    dependsOn:
      compartmentId: ${adb_compartment_ocid}

  existing_adb_admin_password:
    type: password
    required: false
    visible: adb_app_user_enabled
    title: "既存の ADB の ADMIN パスワード"
    description: "アプリ用の DB ユーザーを作るために、Compute が配備のときに ADMIN で接続します（ADB には Compute から接続します）。platform/.env・各製品の .env には書かず、Compute の root だけが読める /u01/aipoc/props/adb_admin.env に置きます。単一引用符は使えません。"
    confirmation: true

  existing_oracle_user:
    type: string
    required: false
    visible:
      not:
        - adb_app_user_enabled
    title: "Existing DB username"
    description: "Value written to PLATFORM_ORACLE_USER in platform/.env (the shared settings file) of every product. Single quotes are not allowed. A dedicated database user (schema) for the suite is recommended; a user other than ADMIN needs the privileges and tablespace quota listed in terraform/README.md (application database user), otherwise the table initialization fails and the deployment check reports NG. Used only when the application database user is disabled."
    default: "ADMIN"

  existing_oracle_password:
    type: password
    required: false
    visible:
      not:
        - adb_app_user_enabled
    title: "Existing DB password"
    description: "Value written to PLATFORM_ORACLE_PASSWORD in platform/.env (the shared settings file) of every product. Single quotes are not allowed."
    confirmation: true

  existing_oracle_dsn:
    type: string
    required: false
    visible: true
    title: "Existing DB DSN"
    description: "Optional. Value written to PLATFORM_ORACLE_DSN in platform/.env (the shared settings file). Leave blank to use <selected ADB db_name>_high, for example SUITEADB -> suiteadb_high."

  existing_oracle_wallet_password:
    type: password
    required: false
    visible: false
    title: "Existing DB wallet password"
    description: "Hidden compatibility input. Existing ADB wallet generation reuses the existing DB password."
    confirmation: true

  adb_display_name:
    type: string
    required: false
    visible: true
    title: "ADB display name"
    description: "Leave blank to use the database name."

  adb_name:
    type: string
    required: true
    visible: true
    title: "Database name"
    description: "ADB database name. Default is SUITEADB. Every deployed product uses this database."
    default: "SUITEADB"
    pattern: "^[A-Za-z][A-Za-z0-9]{0,13}$"

  adb_workload:
    type: enum
    required: true
    visible: true
    title: "Workload type"
    enum:
      - "OLTP"
      - "AJD"
      - "LH"
    default: "LH"

  adb_db_version:
    type: enum
    required: true
    visible: true
    title: "Database version"
    enum:
      - "19c"
      - "23ai"
      - "26ai"
    default: "26ai"

  adb_compute_model:
    type: enum
    required: true
    visible: false
    title: "Compute model"
    enum:
      - "ECPU"
      - "OCPU"
    default: "ECPU"

  adb_compute_count:
    type: number
    required: true
    visible: true
    title: "ECPU count"
    default: 2

  adb_is_auto_scaling_enabled:
    type: boolean
    required: true
    visible: true
    title: "CPU auto scaling"
    default: false

  adb_data_storage_size_in_tbs:
    type: number
    required: true
    visible: true
    title: "Storage (TB)"
    default: 1

  adb_is_auto_scaling_for_storage_enabled:
    type: boolean
    required: true
    visible: true
    title: "Storage auto scaling"
    default: false

  adb_is_elastic_pool_enabled:
    type: boolean
    required: true
    visible: false
    title: "Enable elastic pool"
    default: false

  adb_resource_pool_size:
    type: number
    required: true
    visible: false
    title: "Elastic pool size"
    default: 0

  adb_resource_pool_storage_size_in_tbs:
    type: number
    required: true
    visible: false
    title: "Elastic pool storage (TB)"
    default: 0

  license_model:
    type: enum
    required: true
    visible: true
    title: "License type"
    enum:
      - "BRING_YOUR_OWN_LICENSE"
      - "LICENSE_INCLUDED"
    default: "LICENSE_INCLUDED"

  adb_backup_retention_period_in_days:
    type: number
    required: true
    visible: true
    title: "Automatic backup retention period (days)"
    default: 1

  adb_password:
    type: password
    required: false
    visible: true
    title: "Database ADMIN password"
    description: "ADMIN password of the new ADB. With the application database user (default), the Compute instance uses it only to create that user, and it is not written to platform/.env. Without it, it is also the wallet password and the Oracle connection password of every product. Single quotes are not allowed."
    confirmation: true
    pattern: '^$|^[^"''\r\n]{12,30}$'

  adb_network_access_type:
    type: enum
    required: true
    visible: true
    title: "アクセス・タイプ"
    description: "Autonomous AI Databaseのネットワーク・アクセスを選択します。すべての場所からのセキュア・アクセスはパブリック・エンドポイントを使用し、許可されたIPおよびVCN限定のセキュア・アクセスはACLで接続元を制限し、プライベート・エンドポイント・アクセスのみは指定したVCN内のプライベート・エンドポイントを使用します。"
    enum:
      - "すべての場所からのセキュア・アクセス"
      - "許可されたIPおよびVCN限定のセキュア・アクセス"
      - "プライベート・エンドポイント・アクセスのみ"
    default: "プライベート・エンドポイント・アクセスのみ"

  adb_private_endpoint_vcn_compartment_id:
    type: oci:identity:compartment:id
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "プライベート・エンドポイント・アクセスのみ"
    title: "VCNのコンパートメント"
    description: "プライベート・エンドポイントで使用するVCNが存在するコンパートメントを選択します。"
    default: compartment_ocid

  adb_private_endpoint_vcn_id:
    type: oci:core:vcn:id
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "プライベート・エンドポイント・アクセスのみ"
    title: "仮想クラウド・ネットワーク"
    description: "Autonomous AI Databaseのプライベート・エンドポイントで使用するVCNを選択します。"
    dependsOn:
      compartmentId: ${adb_private_endpoint_vcn_compartment_id}

  adb_private_endpoint_subnet_compartment_id:
    type: oci:identity:compartment:id
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "プライベート・エンドポイント・アクセスのみ"
    title: "サブネットのコンパートメント"
    description: "Autonomous AI Databaseをアタッチするサブネットが存在するコンパートメントを選択します。"
    default: compartment_ocid

  adb_subnet_id:
    type: oci:core:subnet:id
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "プライベート・エンドポイント・アクセスのみ"
    title: "サブネット"
    description: "Autonomous AI Databaseのプライベート・エンドポイントをアタッチするサブネットを選択します。"
    dependsOn:
      compartmentId: ${adb_private_endpoint_subnet_compartment_id}
      vcnId: ${adb_private_endpoint_vcn_id}

  adb_acl_notation_type:
    type: enum
    required: true
    visible:
      eq:
        - adb_network_access_type
        - "許可されたIPおよびVCN限定のセキュア・アクセス"
    title: "IP表記法タイプ"
    description: "ACLで許可する接続元を、VCNまたはIPアドレス/CIDRブロックから選択します。"
    enum:
      - "VCN"
      - "IPアドレスまたはCIDRブロック"
    default: "VCN"

  adb_acl_vcn_compartment_id:
    type: oci:identity:compartment:id
    required: true
    visible:
      and:
        - eq:
            - adb_network_access_type
            - "許可されたIPおよびVCN限定のセキュア・アクセス"
        - eq:
            - adb_acl_notation_type
            - "VCN"
    title: "VCNのコンパートメント"
    description: "アクセスを許可するVCNのコンパートメントを選択します。"
    default: compartment_ocid

  adb_acl_vcn_id:
    type: oci:core:vcn:id
    required: true
    visible:
      and:
        - eq:
            - adb_network_access_type
            - "許可されたIPおよびVCN限定のセキュア・アクセス"
        - eq:
            - adb_acl_notation_type
            - "VCN"
    title: "許可する仮想クラウド・ネットワーク"
    description: "Service Gateway経由でAutonomous AI Databaseへのアクセスを許可するVCNを選択します。"
    dependsOn:
      compartmentId: ${adb_acl_vcn_compartment_id}

  adb_acl_subnet_compartment_id:
    type: oci:identity:compartment:id
    required: false
    visible:
      and:
        - eq:
            - adb_network_access_type
            - "許可されたIPおよびVCN限定のセキュア・アクセス"
        - eq:
            - adb_acl_notation_type
            - "VCN"
    title: "サブネットのコンパートメント"
    description: "アクセスを許可するサブネットのコンパートメントを選択します。サブネットを指定しない場合は選択したVCN全体を許可します。"
    default: compartment_ocid

  adb_acl_subnet_id:
    type: oci:core:subnet:id
    required: false
    visible:
      and:
        - eq:
            - adb_network_access_type
            - "許可されたIPおよびVCN限定のセキュア・アクセス"
        - eq:
            - adb_acl_notation_type
            - "VCN"
    title: "許可するサブネット（オプション）"
    description: "選択したサブネットのCIDRをVCNアクセス制御ルールへ追加します。未選択の場合はVCN全体を許可します。"
    dependsOn:
      compartmentId: ${adb_acl_subnet_compartment_id}
      vcnId: ${adb_acl_vcn_id}

  adb_acl_cidr_blocks:
    type: string
    required: false
    visible:
      and:
        - eq:
            - adb_network_access_type
            - "許可されたIPおよびVCN限定のセキュア・アクセス"
        - eq:
            - adb_acl_notation_type
            - "IPアドレスまたはCIDRブロック"
    title: "許可するIPアドレスまたはCIDRブロック"
    description: "パブリック・インターネットからの接続を許可するクライアントのパブリックIPアドレスまたはパブリックCIDRブロックをカンマ区切りで入力します。"

  adb_app_user_name:
    type: string
    required: false
    visible: adb_app_user_enabled
    title: "アプリ用の DB ユーザー名"
    description: "英字で始まる 30 文字以内の英字・数字・_（ADMIN・SYS など Oracle の管理のユーザーは使えません）。PLATFORM_ORACLE_USER に書きます。"
    default: "ADB_APP_USER"
    pattern: "^[A-Za-z][A-Za-z0-9_]{0,29}$"

  adb_app_user_password:
    type: password
    required: false
    visible: adb_app_user_enabled
    title: "アプリ用の DB ユーザーのパスワード"
    description: "12〜30 文字で、英大文字・英小文字・数字を 1 つ以上含めます（ユーザー名・二重引用符・単一引用符は使えません）。PLATFORM_ORACLE_PASSWORD と Wallet のパスワードに使います。"
    confirmation: true

  adb_is_mtls_connection_required:
    type: boolean
    required: true
    visible: false
    title: "相互TLS (mTLS)認証が必要"
    description: "既定では有効です。Thinモードは生成したWalletでmTLS接続します。Walletを使用しない一方向TLSのADBだけ無効にしてください。"
    default: true

  instance_image_source_id:
    type: enum
    required: true
    visible: true
    title: "Compute image"
    description: "Oracle Linux 9 image (Oracle-Linux-9.8-2026.09.18-0) of every Compute instance. Choose it according to your region."
    enum:
      - "ocid1.image.oc1.ap-osaka-1.aaaaaaaabdp5adn6fy2h63s5iizgqv77wz4fqrjzosackszdo2gn5rn436ha"
      - "ocid1.image.oc1.ap-tokyo-1.aaaaaaaawxmm5rja45shcpoactn4avvfv2sty55ap5jnaxqmpzbgtdc7qcsa"
      - "ocid1.image.oc1.us-chicago-1.aaaaaaaaltnu52rsd7s6p7yepblc6cdq7b7orqkndiwlz2eggv5ja2ltn52a"
    default: "ocid1.image.oc1.ap-osaka-1.aaaaaaaabdp5adn6fy2h63s5iizgqv77wz4fqrjzosackszdo2gn5rn436ha"

  instance_display_name:
    type: string
    required: true
    visible: true
    title: "Compute instance name"
    default: "PRODUCTION_READY_SUITE"

  instance_shape:
    type: enum
    required: true
    visible: true
    title: "Compute shape"
    description: "Shape of the Compute instance that runs every selected product."
    enum:
      - "VM.Standard.E4.Flex"
      - "VM.Standard.E5.Flex"
    default: "VM.Standard.E5.Flex"

  instance_flex_shape_ocpus:
    type: number
    required: true
    visible: true
    title: "Compute OCPUs"
    description: "The selected products share one Compute instance. The RAG CPU document parser (Docling) uses the most; raise it for heavy ingestion."
    default: 4

  instance_flex_shape_memory:
    type: number
    required: true
    visible: true
    title: "Compute memory (GB)"
    description: "The RAG CPU document parser (Docling) loads ML models; raise it for heavy ingestion."
    default: 32

  instance_boot_volume_size:
    type: number
    required: true
    visible: true
    title: "Boot volume size (GB)"
    description: "The per-service Python environments and models of the RAG parsers are large. 200 GB covers the three products (the OS and Node.js are shared)."
    default: 200

  instance_boot_volume_vpus:
    type: number
    required: true
    visible: true
    title: "Boot volume VPUs/GB"
    default: 10

  subnet_ai_subnet_id:
    type: oci:core:subnet:id
    required: true
    visible: true
    title: "Compute subnet"
    description: "Subnet of the Compute instance. Select a public or private subnet; public IP assignment is detected automatically. Allow the public port (https_port, default 443; http_port when HTTPS is off) in its security list. With a private endpoint ADB, allow TCP 1522 from this subnet's CIDR in the ADB subnet's security list."
    dependsOn:
      compartmentId: ${compartment_ocid}
      vcnId: ${vcn_ai_vcn_id}

  ssh_authorized_keys:
    type: oci:core:ssh:publickey
    required: true
    visible: true
    title: "SSHキーの追加"
    description: "SSHキーペアを自動生成するか、既存の公開キーをアップロードまたは貼り付けて、opcユーザーのSSH接続に使用します。"

  # 画面には出さない（#3274。利用者の判断で既定の UTC を使う）。変数は残し、Terraform の CLI などでは
  # Asia/Tokyo も選べる。
  timezone:
    type: enum
    required: true
    visible: false
    title: "時間帯"
    description: "Compute の OS の時間帯と、3 製品の共通の設定（platform/.env の PLATFORM_TIMEZONE。今日〔検索・期間の基準日〕と既定の時間帯）です。UTC（既定。OCI の Database の Time Zone の既定）か Asia/Tokyo（日本時間：東京・大阪など、UTC+9）を選びます。時刻の保存は UTC のままです。Autonomous AI Database の時間帯（DBTIMEZONE）は stack では変えません（README の手順で ADMIN が設定します）。"
    enum:
      - "UTC"
      - "Asia/Tokyo"
    default: "UTC"

  bastion_enabled:
    type: boolean
    required: true
    visible: true
    title: "Bastion Compute"
    description: "オンにすると、Suite の Compute とは別に bastion の Compute を 1 台作ります。GNOME のデスクトップ・TigerVNC（:1 = TCP 5901。firewalld で開けます）・Google Chrome を入れます。配置先・shape・image（Oracle Linux 9）・SSH キーは bastion 専用に指定します。主 Compute の設定は使いません。bastion から ADB（1522）と Suite の Compute（公開の port・22）に届くよう、それぞれの subnet の security list で bastion の subnet の CIDR を許可してください。"
    default: false

  bastion_display_name:
    type: string
    required: true
    visible: bastion_enabled
    title: "Bastion instance name"
    default: "PRODUCTION_READY_BASTION"

  bastion_compartment_ocid:
    type: oci:identity:compartment:id
    required: true
    visible: bastion_enabled
    title: "Bastion compartment"

  bastion_availability_domain:
    type: oci:identity:availabilitydomain:name
    required: true
    visible: bastion_enabled
    title: "Bastion availability domain"
    dependsOn:
      region: ${region}
      compartmentId: ${bastion_compartment_ocid}

  bastion_vcn_id:
    type: oci:core:vcn:id
    required: true
    visible: bastion_enabled
    title: "Bastion VCN"
    dependsOn:
      compartmentId: ${bastion_compartment_ocid}

  bastion_shape:
    type: enum
    required: true
    visible: bastion_enabled
    title: "Bastion shape"
    description: "bastion 専用の shape を選択します。主 Compute の設定は使いません。"
    enum:
      - "VM.Standard.E4.Flex"
      - "VM.Standard.E5.Flex"
    default: "VM.Standard.E5.Flex"

  bastion_image_source_id:
    type: enum
    required: true
    visible: bastion_enabled
    title: "Bastion image"
    description: "bastion 専用の Oracle Linux 9 image。配備先リージョンの image を選びます。既定は大阪です。"
    enum:
      - "ocid1.image.oc1.ap-osaka-1.aaaaaaaabdp5adn6fy2h63s5iizgqv77wz4fqrjzosackszdo2gn5rn436ha"
      - "ocid1.image.oc1.ap-tokyo-1.aaaaaaaawxmm5rja45shcpoactn4avvfv2sty55ap5jnaxqmpzbgtdc7qcsa"
      - "ocid1.image.oc1.us-chicago-1.aaaaaaaaltnu52rsd7s6p7yepblc6cdq7b7orqkndiwlz2eggv5ja2ltn52a"
    default: "ocid1.image.oc1.ap-osaka-1.aaaaaaaabdp5adn6fy2h63s5iizgqv77wz4fqrjzosackszdo2gn5rn436ha"

  bastion_ssh_authorized_keys:
    type: oci:core:ssh:publickey
    required: true
    visible: bastion_enabled
    title: "Bastion SSHキーの追加"
    description: "bastion の opc ユーザー用の SSH 公開キーを指定します。主 Compute のキーは使いません。"
    default: ""

  bastion_flex_shape_ocpus:
    type: number
    required: true
    visible: bastion_enabled
    title: "Bastion OCPUs"
    default: 2

  bastion_flex_shape_memory:
    type: number
    required: true
    visible: bastion_enabled
    title: "Bastion memory (GB)"
    default: 16

  bastion_boot_volume_size:
    type: number
    required: true
    visible: bastion_enabled
    title: "Bastion boot volume size (GB)"
    default: 100

  bastion_boot_volume_vpus:
    type: number
    required: true
    visible: bastion_enabled
    title: "Bastion boot volume VPUs/GB"
    default: 10

  bastion_subnet_id:
    type: oci:core:subnet:id
    required: true
    visible: bastion_enabled
    title: "Bastion subnet"
    description: "bastion 専用の subnet を選びます。主 Compute の subnet は使いません。管理者の CIDR から TCP 22 と 5901 を許可してください。"
    dependsOn:
      compartmentId: ${bastion_compartment_ocid}
      vcnId: ${bastion_vcn_id}

  bastion_vnc_password:
    type: password
    required: false
    visible: bastion_enabled
    title: "Bastion VNC password"
    description: "VNC password of the opc user (exactly 8 characters; TigerVNC uses only the first 8). Required when the bastion is created."
    confirmation: true
    pattern: '^$|^.{8}$'

  deploy_rag:
    type: boolean
    required: true
    visible: false
    title: "RAG"
    description: "Production Ready RAG（ナレッジ構築・検索・回答プロファイル・検索・回答）を配備します（/rag/）。選んだ製品は 1 台の Compute に入ります。少なくとも1つの製品を選択してください。"
    default: true

  deploy_nl2sql:
    type: boolean
    required: true
    visible: false
    title: "NL2SQL"
    description: "Production Ready NL2SQL（SQL 専用の自然言語問い合わせ）を配備します（/nl2sql/）。"
    default: true

  deploy_agent:
    type: boolean
    required: true
    visible: false
    title: "Agent Control Plane"
    description: "Production Control Plane for AI Agents を配備します（/agent/。/ はここへ転送します）。"
    default: true


  rag_enable_parser_unstructured:
    type: boolean
    required: true
    visible: deploy_rag
    title: "Unstructured parser (CPU)"
    description: "The Docling parser (CPU, PDF and images) is always installed as the default document parser. This option also installs and starts parser-unstructured as a systemd service and enables it in the document parsing settings, to ingest text, Markdown, CSV, JSON, XML, HTML, Office, and e-mail files; select Unstructured in the document's processing recipe."
    default: true





  platform_environment:
    type: enum
    required: true
    visible: false
    title: "共通の実行環境"
    description: "3製品共通。staging / production は HTTPS とログイン認証が必要。"
    enum:
      - "local"
      - "staging"
      - "production"
    default: "staging"


  app_admin_login_user_id:
    type: enum
    required: true
    visible: false
    title: "Administrator login user ID"
    description: "Fixed login user ID for the built-in SYSTEM_ADMIN configuration administrator. It must be exactly system_admin and is independent from the database connection user."
    enum:
      - "system_admin"
    default: "system_admin"

  app_admin_login_user_password:
    type: password
    required: false
    visible:
      or:
        - deploy_rag
        - deploy_nl2sql
        - deploy_agent
    title: "Administrator password"
    description: "Required when any product is deployed. Login password of the configuration administrator (login user ID: system_admin) shared by RAG, NL2SQL, and the Agent Control Plane, written to PLATFORM_ADMIN_LOGIN_USER_PASSWORD. Create the other users and roles from User Management after the first login. 12-30 characters with uppercase, lowercase, and digits; must not include admin, double quotes, or line breaks."
    confirmation: true
    pattern: '^$|^[^"\r\n]{12,30}$'





  agent_runtime_repository_backend:
    type: enum
    required: true
    visible: false
    title: "Agent Runtime repository"
    description: "Oracle repository for Agent runs, business agents and screen-edited definitions. The tables are created by the Agent system tables (init_script.sh); the application does not run DDL."
    enum:
      - "oracle_checkpoint"
      - "oracle_normalized"
    default: "oracle_checkpoint"





