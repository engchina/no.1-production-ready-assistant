[project]
name = "production-ready-rag-backend"
version = "0.1.0"
description = "Production-ready RAG backend (FastAPI + OCI Enterprise AI + Oracle AI Database)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.121,<1.0",
    "starlette>=1.0.1,<2.0",
    "anyio>=4.14.2",
    "python-multipart>=0.0.20",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.1",
    "httpx==0.28.1",
    "gunicorn>=26,<27",
    "oci>=2.168",
    "oracledb>=3.4",
    "python-json-logger>=4.0",
    "prometheus-client>=0.24",
    "charset-normalizer>=3.4,<4",
    "pypdf>=6.4,<7",
    "rag-parser-core",
    "rag-pipeline-core",
    # rag_poc 由来の Small-to-Big 分割・検索・根拠付き回答・FAQ/ドメインキーワード。
    # 日本語分割(Sudachi)と FAQ の Excel 取込を使う。docling/torch は入れない。
    # pdf(pypdfium2 / Pillow)は解析後の Vision(図の切り出し・表内画像の検出。#497)で使う。
    "rag-engine[japanese,excel,pdf]",
    "production-ready-backend-core",
    "production-ready-system-settings-backend",
    # 製品の評価と suite の評価が共有する決定的な採点の部品（#3240）。
    "production-ready-evaluation-scoring",
]

# 重い parser 依存(docling/unstructured)は backend に載せない。
# 各 parser は services/parsers/<name> の独立イメージで動き、backend は HTTP で委譲する
# (app.clients.parser_service)。各 parser は独立して upgrade でき、相互に非干渉。
#
# 下記 per-adapter extra は **ローカルでの単一 adapter デバッグ専用**(任意)。
# runtime backend / 既定 `uv sync` は parser を一切入れない。
[project.optional-dependencies]
# torch / torchvision は CPU 版の index から入れるため、extra に直接書く（uv の sources は直接の依存にだけ効く。#1650）。
docling = ["docling==2.132.0", "torch>=2.13,<3", "torchvision>=0.28,<1"]
# unstructured の extra は parser のサービス（services/parsers/unstructured）と同じ。all-docs にしない（#3351）。
unstructured = [
    "unstructured[pdf,image,docx,pptx,xlsx,csv,tsv,md]==0.27.8",
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
]

[tool.uv]
# docling-slim（最新 2.141.0）が pillow を <13 に制約するが、取り込む文書の画像の解析の脆弱性（GHSA-462x-pgg6-55fp ほか 8 件）の修正版は 13.0.0。13.0.0 の非互換は削除された API だけで docling・本リポジトリは使わないため、制約を上書きする（#2790）。docling が 13 を許したら外す。
# unstructured の filelock <4 制約を、既知の脆弱性の修正版へ置き換える。FileLock の context manager と timeout を確認済み。
override-dependencies = ["pillow>=13.0.0", "filelock>=4.2.1"]
# pi-heif（LGPL-3.0 の libheif を同梱）と pypandoc-binary（GPL-2.0+ の pandoc を同梱）は入れない（#3351。理由と代わりの
# 扱いは services/parsers/unstructured/pyproject.toml）。
exclude-dependencies = ["pi-heif", "pypandoc-binary"]

[tool.uv.sources]
rag-parser-core = { path = "../packages/rag_parser_core", editable = true }
rag-pipeline-core = { path = "../packages/rag_pipeline_core", editable = true }
rag-engine = { path = "../packages/rag_engine", editable = true }
# 共有 backend インフラ（platform repo の sibling パス）。変更時は uv lock 再生成が必要。
production-ready-backend-core = { path = "../../platform/packages/backend_core", editable = true }
production-ready-system-settings-backend = { path = "../../platform/packages/system_settings_backend", editable = true }
production-ready-evaluation-scoring = { path = "../../platform/packages/evaluation_scoring", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# torch / torchvision は PyTorch の CPU 版の index から入れる（#1650）。PyPI の Linux の wheel は CUDA 版で、
# triton・nvidia-* / cuda-* の wheel（数 GB）を依存に持つが、配備先・CI に GPU は無い。
# explicit = true で、この index は sources で指定した package にだけ使う（ほかの依存は PyPI から入れる）。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
    "mypy>=1.14",
    "bandit>=1.8",
    "pip-audit>=2.9",
    # テストの合成の PDF を作る（BSD。#3343）。実行時には使わない。
    "reportlab>=4.4,<6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# 整形（#345）。black と同じ既定（二重引用符・空白の字下げ・magic trailing comma を尊重）にそろえる。
# 行の長さは [tool.ruff] の line-length を共有する。
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --dist loadgroup: `-n` で並列にしたとき、実 Oracle のテスト（xdist_group "oracle"）を
# 1 つの worker にまとめる（tests/conftest.py。#344）。`-n` なしの直列では何もしない。
addopts = "-q --dist loadgroup"
# 1 つのテストが止まったら 120 秒で失敗にし、stack を出す（pytest-timeout。#1591）。job の上限（15 分）まで
# 待たない。遅いテストは `@pytest.mark.timeout(<秒>)` で個別に延ばす。
timeout = 120

[tool.bandit]
# 偽陽性/本コードベースで許容済みのチェックを除外する(High の B324 はコード側で
# usedforsecurity=False により正修正済み)。
#   B101: 不変条件の表明に assert を用いる(本番最適化前提のコードではない)
#   B404/B603: services/control の subprocess は allowlist 化した固定引数のみ実行する
#   B608: oracle の SQL は bind 変数利用で、f-string は内部生成の SQL 断片/識別子のみ
skips = ["B101", "B404", "B603", "B608"]
