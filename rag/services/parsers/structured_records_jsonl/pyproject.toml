[project]
name = "parser-structured-records-jsonl"
version = "0.1.0"
description = "Structured records JSON Lines parser microservice (#2457)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "production-ready-backend-core",
    # 解析の実体は rag_parser_core.structured_records（JSONL を契約どおりに読む。外部の parser の package は使わない）。
    "rag-parser-core[service]",
]

[tool.uv.sources]
production-ready-backend-core = { path = "../../../../platform/packages/backend_core", editable = true }
rag-parser-core = { path = "../../../packages/rag_parser_core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
