[project]
name = "parser-docling"
version = "0.1.0"
description = "Docling parser microservice (independent dependency boundary)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "production-ready-backend-core",
    "rag-parser-core[service]",
    # rag_poc の解析実装(読み順・表補修)。Vision は backend の解析後の段が行う(#497)。
    "rag-engine[docling]",
    "docling==2.132.0",
    # docling の PDF の backend。7.21 以前は 1 バイトの埋め込みフォントで文字コード 0x20 に割り当てた字
    # （LibreOffice の PDF で起きる。例「点検の記録」の「記」）を空白にして落とす（#1505）。
    "docling-parse>=7.22.2,<8.0",
    # Docling の解析は RapidOCR(ONNX)で OCR する。docling は onnxruntime を必須依存に含めない。
    "onnxruntime>=1.20",
    # rapidocr と docling の TableFormer が import する cv2 は、GUI 版ではなく headless 版で入れる
    # (#310)。GUI 版は libxcb / libGL / glib を要し、slim の base image では import が失敗する。
    "opencv-python-headless>=4.10,<6.0",
    # docling（docling-ibm-models）の推論が使う torch / torchvision を、CPU 版の index から入れるために直接の依存に
    # 書く（uv の [tool.uv.sources] は直接の依存にだけ効く。index は下の [[tool.uv.index]]。#1650）。
    "torch>=2.13,<3",
    "torchvision>=0.28,<1",
]

[tool.uv]
# docling-slim（最新 2.141.0）が pillow を <13 に制約するが、取り込む文書の画像の解析の脆弱性（GHSA-462x-pgg6-55fp ほか 8 件）の修正版は 13.0.0。13.0.0 の非互換は削除された API だけで docling・本リポジトリは使わないため、制約を上書きする（#2790）。docling が 13 を許したら外す。
override-dependencies = ["pillow>=13.0.0"]
# rapidocr が要求する GUI 版の opencv-python を入れない(cv2 は上の headless 版が提供する)。
# 両方を入れると同じ cv2 パッケージを上書きし合うため、依存の解決から外す(uv.lock にも残らない)。
exclude-dependencies = ["opencv-python"]

[tool.uv.sources]
production-ready-backend-core = { path = "../../../../platform/packages/backend_core", editable = true }
rag-parser-core = { path = "../../../packages/rag_parser_core", editable = true }
rag-engine = { path = "../../../packages/rag_engine", editable = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# torch / torchvision は PyTorch の CPU 版の index から入れる（#1650）。PyPI の Linux の wheel は CUDA 版で、
# triton・nvidia-* / cuda-* の wheel（数 GB）を依存に持つが、配備先の Compute は GPU を持たない。
# explicit = true で、この index は上の sources で指定した package にだけ使う（ほかの依存は PyPI から入れる）。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
