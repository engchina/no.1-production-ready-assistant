[project]
name = "preprocess-word-to-jsonl-service"
version = "0.1.0"
description = "前処理(Preprocess)microservice: Word(.doc/.docx)→構造化レコード JSONL(LibreOffice + python-docx)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "production-ready-backend-core",
    "rag-parser-core[service]",
    "python-docx>=1.1,<2",
    "olefile>=0.47,<1",
]

[tool.uv.sources]
production-ready-backend-core = { path = "../../../../platform/packages/backend_core", editable = true }
rag-parser-core = { path = "../../../packages/rag_parser_core", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
