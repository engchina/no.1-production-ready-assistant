[project]
name = "rag-parser-core"
version = "0.1.0"
description = "Shared parser contract (schemas + remap) for backend and parser microservices"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Excel の記録のモデルと読み方（pr_backend_core.spreadsheet。#2525）。
    "production-ready-backend-core",
    "pydantic>=2.11",
    "charset-normalizer>=3.4,<4",
    # oci_enterprise_ai(共有 VLM/LLM core)は openai SDK で OCI OpenAI 互換 API を呼ぶ。
    # httpx は SDK 例外を既存のエラー経路へ変換するために直接参照する。
    "httpx>=0.27",
    # ponytail: 以前は marker-pdf が openai<2 を要求していたため 1.x に揃えた。marker は削除済み
    # (#270)。上限を上げるときは全サービスの lock と SDK 例外型(httpx)の互換を別途確認する。
    "openai>=1.99,<2",
]

[project.optional-dependencies]
# parser マイクロサービスが共通 FastAPI app factory(service.py)を使うための extra。
# core 本体の依存は軽量に保ち、HTTP サーバ依存はこの extra に隔離する。
service = [
    "fastapi>=0.121,<1.0",
    "uvicorn[standard]>=0.37",
    "gunicorn>=23,<24",
    "python-multipart>=0.0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_parser_core"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# 整形（#345）。black と同じ既定（二重引用符・空白の字下げ・magic trailing comma を尊重）にそろえる。
# 行の長さは [tool.ruff] の line-length を共有する。
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.uv.sources]
production-ready-backend-core = { path = "../../../platform/packages/backend_core", editable = true }
