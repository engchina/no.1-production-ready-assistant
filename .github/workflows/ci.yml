        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: platform/packages/system_settings_backend/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Restore mypy cache
        id: mypy-cache
        uses: ./.github/actions/mypy-cache
        with:
          name: platform-system-settings
          path: platform/packages/system_settings_backend/.mypy_cache
          lockfile: platform/packages/system_settings_backend/uv.lock

      - name: Type check
        run: uv run mypy src

      # main の push だけが保存する（PR は復元だけ。#1589）。
      - name: Save mypy cache
        if: github.ref == 'refs/heads/main' && steps.mypy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: platform/packages/system_settings_backend/.mypy_cache
          key: ${{ steps.mypy-cache.outputs.key }}

      # -n auto: pytest-xdist で runner の CPU 数だけ並列に実行する（#344）。--durations=20: 遅いテストの上位 20 件を
      # log に出す（#1591。1 テストの上限は pyproject の pytest-timeout の timeout）。
      - name: Test
        run: uv run pytest -n auto --durations=20

      - name: Security scan
        run: uv run bandit -r src

      - name: Dependency audit
        if: needs.changes.outputs.platform_system_settings_deps == 'true'
        run: uv run pip-audit --skip-editable

  # 製品の評価と suite の評価が共有する採点の部品（#3240）。標準 library だけ。
  platform-evaluation-scoring:
    name: Platform / evaluation_scoring (pr_evaluation_scoring)
    needs: changes
