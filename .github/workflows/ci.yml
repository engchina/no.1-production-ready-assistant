      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: platform/packages/evaluation_scoring/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -n auto --durations=20

      - name: Security scan
        run: uv run bandit -r src

      - name: Dependency audit
        if: needs.changes.outputs.platform_evaluation_scoring_deps == 'true'
        run: uv run pip-audit --skip-editable

  # モデルの API の呼び方の共通の規則（#3418）。標準 library だけ。pr_system_settings と suite が使う。
  platform-enterprise-ai:
    name: Platform / enterprise_ai (pr_enterprise_ai)
    needs: changes
    if: needs.changes.outputs.platform_backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/packages/enterprise_ai
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: platform/packages/enterprise_ai/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -n auto --durations=20

      - name: Security scan
        run: uv run bandit -r src

      - name: Dependency audit
        if: needs.changes.outputs.platform_enterprise_ai_deps == 'true'
        run: uv run pip-audit --skip-editable

  # ---------------------------------------------------------------- rag

  rag-backend:
    name: RAG / Backend
    needs: changes
    # 回答の段落の判定の共通の事例（platform/contracts/answer-passages/）と MCP ツールの契約
    # （platform/contracts/mcp/rag-tools.json。#1531）を読む（rag_contracts。Agent の契約では動かさない。#3240）。
    # 評価ランナーは platform の採点の部品を使う（#3240）。
    if: >-
      needs.changes.outputs.rag_backend == 'true' || needs.changes.outputs.platform_backend == 'true'
      || needs.changes.outputs.rag_contracts == 'true' || needs.changes.outputs.platform_evaluation_scoring == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rag/backend
    steps:
      # backend は共有 production-ready-backend-core（../../platform/packages/backend_core）に path 依存する。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: rag/backend/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Restore mypy cache
        id: mypy-cache
        uses: ./.github/actions/mypy-cache
        with:
          name: rag-backend
          path: rag/backend/.mypy_cache
          lockfile: rag/backend/uv.lock

      - name: Type check
        run: uv run mypy .

      # main の push だけが保存する（PR は復元だけ。#1589）。
      - name: Save mypy cache
        if: github.ref == 'refs/heads/main' && steps.mypy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rag/backend/.mypy_cache
          key: ${{ steps.mypy-cache.outputs.key }}

      # coverage threshold を gate にしていないため CI では計測しない(nl2sql と同一構成)。
      # -n auto: pytest-xdist で並列に実行する。実 Oracle のテストは pyproject の
      # --dist loadgroup で 1 つの worker にまとまる（#344）。
      # --assert=plain: pytest の assert の書き換え（失敗したときに比べた値を出す仕組み）を止める。
      # CI にはテストの書き換え済みの .pyc が無く、worker ごとに全テスト（約 7 万行）を書き換えて、
      # それだけで Test の約 3 分の 1（約 10 秒）を占めていた（#401）。失敗したときだけ、失敗した
      # テストを書き換えありで流し直して詳細を出す（step の結果は失敗のまま）。--durations=20 は #1591。
      - name: Test
        run: |
          uv run pytest -n auto --durations=20 --assert=plain && exit 0
          echo "失敗したテストを、assert の詳細付きで流し直します（--lf）。"
          uv run pytest --lf --lfnf=none --maxfail=20 || true
          exit 1

      - name: Security scan
        run: uv run bandit -c pyproject.toml -r app

      - name: Dependency audit
        if: needs.changes.outputs.rag_deps == 'true'
        # ignore は持たない。ignore を足す場合は理由をここへ明記する。
        run: uv run pip-audit --skip-editable

  rag-engine:
    name: RAG / Engine
    needs: changes
    if: needs.changes.outputs.rag_backend == 'true' || needs.changes.outputs.rag_contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag/packages/rag_engine
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # lock（#387）から入れる。PyPI の索引（/simple/）が落ちても、lock の中のファイルの URL から取れる。
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: rag/packages/rag_engine/uv.lock
          cache-suffix: rag-engine
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # rag_poc 由来の解析・分割・回答・FAQ/ドメインキーワードの回帰テスト。
      # docling/torch は入れず、PDF 描画・日本語分割・Excel の任意依存だけを入れる。
      - name: Test rag_engine
        run: |
          uv sync --locked --extra pdf --extra japanese --extra excel --extra oracle
          uv run --locked --no-sync python -m pytest -q tests

  services-scripts-lint:
    name: Lint / services & scripts
    needs: changes
    if: needs.changes.outputs.rag_backend == 'true' || needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # サービスごとの venv の依存（下の Unit tests）を、ほかの job と同じく main の push だけが保存する。
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: |
            rag/services/**/uv.lock
            rag/packages/*/uv.lock
          cache-suffix: rag-services
          save-cache: ${{ github.event_name == 'push' }}

      # 各 backend の job は自分のディレクトリだけを検査するため、RAG のマイクロサービス（rag/services）と
      # platform のスクリプト（platform/scripts）は、venv を作らずに ruff だけで検査する（#517）。
      # 設定は各サービスの pyproject.toml と platform/scripts/ruff.toml。版は rag/backend の uv.lock の ruff にそろえる。
      - name: Ruff
        run: |
          version="$(sed -n '/^name = "ruff"$/{n;s/^version = "\(.*\)"$/\1/p;}' rag/backend/uv.lock)"
          test -n "${version}"
          uvx "ruff@${version}" check rag/services rag/packages platform/scripts
          uvx "ruff@${version}" format --check rag/services rag/packages platform/scripts

      # e2e の影響分析の選択の規則（platform/scripts/e2e_impact.py。#885）。標準ライブラリだけで動く。
      - name: Unit tests (platform/scripts)
        run: python3 -m unittest discover -s platform/scripts/tests -p 'test_*.py'

      # RAG のサービス（rag/services/<種類>/<name>/tests）と共有の parser の契約（rag_parser_core）の単体テスト。
      # 以前は Excel の前処理（#1221）だけを実行し、ほかの 11 サービスと rag_parser_core のテストは CI のどこでも
      # 実行していなかった（#1525）。各 uv.lock の依存（本番と同じ。--locked で pyproject とのずれも検出する）に
      # pytest だけを足す。parser の docling は RAG / Parser docling の job が実行する（torch 等が重いので分ける）。
      - name: Unit tests (rag/services, rag_parser_core)
        run: |
          status=0
          for tests in rag/packages/rag_parser_core/tests rag/services/*/*/tests; do
            dir="$(dirname "${tests}")"
            case "${dir}" in
              rag/services/parsers/docling) continue ;;
            esac
            echo "::group::${dir}"
            (cd "${dir}" && uv run --locked --all-extras --with pytest python -m pytest -q tests) || status=1
            echo "::endgroup::"
          done
          exit "${status}"

      # テストの無い package・サービスも、uv.lock が pyproject.toml と合っていることを確かめる（配備の
      # `uv sync --locked` が失敗しないように。#1525 で rag_parser_core・rag_pipeline_core の lock のずれが見つかった）。
      - name: Lock check (rag/packages, rag/services)
        run: |
          for lock in rag/packages/*/uv.lock rag/services/*/*/uv.lock; do
            if ! (cd "$(dirname "${lock}")" && uv lock --check -q); then
              echo "::error file=${lock}::uv.lock が pyproject.toml と合っていません（そのディレクトリで uv lock を実行する）。"
              exit 1
            fi
          done

      # 配備（rag-services.sh）が venv を作る lock の脆弱性（#1534。以前はどこでも検査していなかった）。
      # uv.lock / pyproject.toml が変わったディレクトリだけ（全件は dependency-audit-nightly.yml）。
      # RAG / Parser <name> と同じく lock から書き出した requirements（hash 付き。path 依存は --no-emit-local で
      # 除く）を検査する。package の extra（rag_engine の docling 等）も配備で入るので --all-extras を付ける。
      # torch の CPU 版（+cpu）は、RAG / Parser docling と同じく同じ版の PyPI の torch として検査する（#1650）。
      - name: Dependency audit (rag/packages, rag/services)
        if: needs.changes.outputs.rag_services_deps != ''
        env:
          DEPS_FILES: ${{ needs.changes.outputs.rag_services_deps }}
        run: |
          version="$(sed -n '/^name = "pip-audit"$/{n;s/^version = "\(.*\)"$/\1/p;}' rag/backend/uv.lock)"
          test -n "${version}"
          if [ "${DEPS_FILES}" = "all" ]; then
            mapfile -t dirs < <(for lock in rag/packages/*/uv.lock rag/services/*/*/uv.lock; do dirname "${lock}"; done)
          else
            # shellcheck disable=SC2086 # list-files: shell の空白区切り（パスに空白は無い）。
            mapfile -t dirs < <(for file in ${DEPS_FILES}; do dirname "${file}"; done | sort -u)
          fi
          status=0
          for dir in "${dirs[@]}"; do
            case "${dir}" in
              rag/services/parsers/docling) continue ;;
            esac
            [ -f "${dir}/uv.lock" ] || continue
            echo "::group::${dir}"
            (cd "${dir}" && uv export --locked --no-dev --all-extras --no-emit-local --format requirements.txt \
              -o "${RUNNER_TEMP}/requirements.txt" -q \
              && sed -i -E 's/^(torch[a-z]*)==([^ ;+]+)\+cpu /\1==\2 /' "${RUNNER_TEMP}/requirements.txt" \
              && uvx "pip-audit@${version}" --disable-pip -r "${RUNNER_TEMP}/requirements.txt") \
              || { status=1; echo "::error file=${dir}/uv.lock::pip-audit が既知の脆弱性を検出しました（uv lock --upgrade-package で修正版へ上げる）。"; }
            echo "::endgroup::"
          done
          exit "${status}"

  rag-parser-docling:
    name: RAG / Parser docling
    needs: changes
    if: needs.changes.outputs.rag_parser_docling == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rag/services/parsers/docling
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: rag/services/parsers/docling/uv.lock
          cache-suffix: rag-parser-docling
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # 本番と同じ venv（uv sync --locked --no-dev）を rag-services.sh で作る。lock の torch は CPU 版（#1650）。
      # モデルは取得しない。テスト（text layer の抽出・LayoutRecord の変換・cv2 の import）はモデルを使わない（#1512）。
      - name: Install dependencies
        working-directory: rag
        env:
          RAG_SERVICES_MODELS: skip
        run: scripts/rag-services.sh sync parser-docling

      # parser の venv には pytest が無い（--no-dev の本番と同じ venv）ので、pytest だけを足して実行する。
      # HF_HUB_OFFLINE: モデルを取得しない（テストはモデルの要らないものだけ。取得しようとしたら失敗させる）。
      - name: Test
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run --no-sync --with pytest python -m pytest -q tests

      # 版は rag/backend の uv.lock の bandit にそろえる（Lint / services & scripts の ruff と同じ）。
      - name: Security scan
        run: |
          version="$(sed -n '/^name = "bandit"$/{n;s/^version = "\(.*\)"$/\1/p;}' ../../../backend/uv.lock)"
          test -n "${version}"
          uvx "bandit@${version}" -q -r app

      # venv に pip-audit を入れないため、lock から書き出した requirements（hash 付き）を検査する。
      # 自分たちの package（path 依存）は PyPI に無いので書き出さない（--no-emit-local。backend の --skip-editable と同じ）。
      # torch の CPU 版（2.13.0+cpu。#1650）は PyPI に無い版で pip-audit が「検査できない」と飛ばすので、
      # 同じ版の PyPI の torch として検査する（ローカル版の +cpu を外す。脆弱性は CPU 版と CUDA 版で同じ）。
      - name: Dependency audit
        if: needs.changes.outputs.rag_parser_docling_deps == 'true'
        run: |
          version="$(sed -n '/^name = "pip-audit"$/{n;s/^version = "\(.*\)"$/\1/p;}' ../../../backend/uv.lock)"
          test -n "${version}"
          uv export --locked --no-dev --no-emit-local --format requirements.txt -o "${RUNNER_TEMP}/requirements.txt" -q
          sed -i -E 's/^(torch[a-z]*)==([^ ;+]+)\+cpu /\1==\2 /' "${RUNNER_TEMP}/requirements.txt"
          uvx "pip-audit@${version}" --disable-pip -r "${RUNNER_TEMP}/requirements.txt"

  rag-frontend:
    name: RAG / Frontend
    needs: changes
    if: needs.changes.outputs.rag_frontend == 'true' || needs.changes.outputs.platform_frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag/frontend
    steps:
      # frontend は file:../../platform/packages/ui に依存するため、先に共有 UI を build する。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies and build shared UI
        uses: ./.github/actions/platform-ui
        with:
          frontend: rag/frontend

      # 型検査は build の `tsc --noEmit` が兼ねる。Playwright E2E は rag-e2e job（#133）。
      # デザインシステム遵守ルール（../../platform/docs/design-system/adherence.oxlintrc.json を ESLint に渡す）。
      # NL2SQL / Agent と同じく CI で実行する（#1099。以前は lint を実行せず、main の失敗を検出できなかった）。
      - name: Lint
        run: npm run lint

      # e2e の spec・fixture・playwright.config.ts の型検査（tsconfig.e2e.json。Playwright は実行時に型を検査しない。#1591）。
      - name: Type check (e2e)
        run: npm run typecheck:e2e

      - name: Unit test
        run: npm test

      - name: Build
        run: npm run build

  rag-e2e:
    name: RAG / E2E smoke
    # impact が全件（rag_mode == full）なら smoke の spec も全件に含まれるので飛ばす（#1525）。push では e2e-impact が
    # skip されるため、`!cancelled()` で needs の skip を許し、changes の成功を明示して確かめる。
    needs: [changes, e2e-impact]
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && (needs.changes.outputs.rag_frontend == 'true' || needs.changes.outputs.platform_frontend == 'true')
      && needs.e2e-impact.outputs.rag_mode != 'full'
    runs-on: ubuntu-24.04
    # 実測は 1.5〜2 分（2026-10、2 worker。Playwright は約 1 分で、1 worker と差は無い。#1489）。
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rag/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies and build shared UI
        uses: ./.github/actions/platform-ui
        with:
          frontend: rag/frontend

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: rag/frontend

      # PR では約 1 分の smoke と、差分に影響を受ける spec（e2e-impact。#885）を実行する（#184。ユーザー指示：1 回の e2e はおおむね 1 分）。
      # 全件は e2e-nightly.yml が毎晩実行する。desktop / mobile の 2 project（PR の mobile は @responsive だけ。
      # workflow の env の E2E_MOBILE_SCOPE。#1582）、retries は workflow の env の E2E_RETRIES（PR は 1。#1593）。
      # worker 数は playwright.config.ts の CI の値（2。4 vCPU の runner。spec のファイル単位で並べる。#1489）。
      # spec は workflow の env の RAG_E2E_SMOKE（空白区切り。単語分割を意図している）。
      - name: Playwright E2E (smoke)
        run: |
          # shellcheck disable=SC2086
          npx playwright test $RAG_E2E_SMOKE

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rag-playwright-smoke
          path: rag/frontend/test-results
          retention-days: 7

  # ---------------------------------------------------------------- nl2sql

  nl2sql-frontend:
    name: NL2SQL / Frontend
    needs: changes
    if: >-
      needs.changes.outputs.nl2sql_frontend == 'true' || needs.changes.outputs.platform_frontend == 'true'
      || needs.changes.outputs.nl2sql_frontend_contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nl2sql/frontend
    steps:
      # frontend は file:../../platform/packages/ui に依存するため、先に共有 UI を build する。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies and build shared UI
        uses: ./.github/actions/platform-ui
        with:
          frontend: nl2sql/frontend

      # デザインシステム遵守ルール（frontend/.oxlintrc.json が ../../platform の
      # docs/design-system/adherence.oxlintrc.json を extends）と oxlint 既定の correctness ルール。
      - name: Lint
        run: npm run lint

      # `tsc -p tsconfig.test.json`（tsconfig.json を extends し、src と tests を含む）で型検査してから node --test を実行する。
      - name: Logic tests
        run: npm run test:logic

      # 型検査は Logic tests の tsc が src も含めて済ませているため、`npm run build`（tsc --noEmit && vite build）の
      # tsc を二重に実行せず、vite build だけを行う（#339）。
      - name: Build
        run: npx --no-install vite build

  nl2sql-e2e:
    name: NL2SQL / E2E smoke
    # impact が全件なら飛ばす（RAG / E2E smoke と同じ。#1525）。
    needs: [changes, e2e-impact]
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && (needs.changes.outputs.nl2sql_frontend == 'true' || needs.changes.outputs.platform_frontend == 'true')
      && needs.e2e-impact.outputs.nl2sql_mode != 'full'
    runs-on: ubuntu-24.04
    # 実測は約 2.5 分（2026-10、2 worker。Playwright は 1.7〜1.9 分。1 worker・sql-chat の両 project では 5 分。#1489）。
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nl2sql/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies and build shared UI
        uses: ./.github/actions/platform-ui
        with:
          frontend: nl2sql/frontend

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: nl2sql/frontend

      # PR では約 1 分の smoke と、差分に影響を受ける spec（e2e-impact。#885）を実行する（#184。ユーザー指示：1 回の e2e はおおむね 1 分）。
      # 全件は e2e-nightly.yml が毎晩 8 shard で実行する。retries は workflow の env の E2E_RETRIES（PR は 1。#1593）。
      # worker 数は playwright.config.ts の CI の値（2。fullyParallel でテスト単位で並ぶ）。#175 の遅い環境での flake の後に
      # `--workers=1` で 1 worker に固定していたが、smoke が 4〜6 分に伸びたため外した（#1489）。
      # 最も重い sql-chat（両 project で約 80 テスト中 58）と database-gate は desktop だけにし、375px の確認は
      # impact（チャットの画面に触る PR）と nightly に任せる。build と preview の起動を 1 回にするため 1 回の実行にまとめ、
      # `--grep-invert` で mobile-375 の 2 spec を外す（grep は「project 名 spec のファイル名 題名」に当たる）。
      # spec は workflow の env（NL2SQL_E2E_SMOKE は全 project、NL2SQL_E2E_SMOKE_DESKTOP は desktop だけ。
      # DESKTOP を変えたら --grep-invert の spec 名もそろえる）。
      - name: Playwright E2E (smoke)
        run: |
          # shellcheck disable=SC2086
          npx playwright test --grep-invert "mobile-375 .*(sql-chat|database-gate)\.spec" \
            $NL2SQL_E2E_SMOKE $NL2SQL_E2E_SMOKE_DESKTOP

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nl2sql-playwright-smoke
          path: nl2sql/frontend/test-results
          retention-days: 7

  nl2sql-backend:
    name: NL2SQL / Backend
    needs: changes
    # MCP ツールの契約（platform/contracts/mcp/nl2sql-tools.json）も読む（#1531）。
    if: >-
      needs.changes.outputs.nl2sql_backend == 'true' || needs.changes.outputs.platform_backend == 'true'
      || needs.changes.outputs.mcp_contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NL2SQL_RUNTIME_MODE: memory
      NL2SQL_FEEDBACK_EMBEDDING_ENABLED: "false"
    defaults:
      run:
        working-directory: nl2sql/backend
    steps:
      # backend は共有 production-ready-backend-core（../../platform/packages/backend_core）に path 依存する。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: nl2sql/backend/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Restore mypy cache
        id: mypy-cache
        uses: ./.github/actions/mypy-cache
        with:
          name: nl2sql-backend
          path: nl2sql/backend/.mypy_cache
          lockfile: nl2sql/backend/uv.lock

      - name: Type check
        run: uv run mypy .

      # main の push だけが保存する（PR は復元だけ。#1589）。
      - name: Save mypy cache
        if: github.ref == 'refs/heads/main' && steps.mypy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nl2sql/backend/.mypy_cache
          key: ${{ steps.mypy-cache.outputs.key }}

      # -n auto: pytest-xdist で runner の CPU 数だけ並列に実行する（#344）。--durations=20: 遅いテストの上位 20 件を
      # log に出す（#1591。1 テストの上限は pyproject の pytest-timeout の timeout）。
      - name: Test
        run: uv run pytest -n auto --durations=20

      - name: Security scan
        run: uv run bandit -r app

      - name: Dependency audit
        if: needs.changes.outputs.nl2sql_deps == 'true'
        # ignore は持たない（以前の GHSA-537c-gmf6-5ccf の ignore は、OCI SDK の依存を外した #11 で不要になった）。
        # ignore を足すときは dependency-audit-nightly.yml にも同じ ignore を書く。
        run: uv run pip-audit --skip-editable

  # ---------------------------------------------------------------- agent
  #
  # 旧 `Agent / Full Checks`（1 job で backend・frontend・Playwright 全件を直列に実行）を 3 job に分けた（#339）。
  # PR の e2e は RAG / NL2SQL と同じく約 1 分の smoke と差分に影響を受ける spec（#885）にし、全件は e2e-nightly.yml が実行する。

  agent-backend:
    name: Agent / Backend
    needs: changes
    # MCP ツールの契約（platform/contracts/mcp/）も読む（#1531）。
    if: >-
      needs.changes.outputs.agent_backend == 'true' || needs.changes.outputs.platform_backend == 'true'
      || needs.changes.outputs.answer_passages_contract == 'true' || needs.changes.outputs.mcp_contract == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      # backend は ../../platform の共有パッケージに path 依存する。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: agent/backend/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Restore mypy cache
        id: mypy-cache
        uses: ./.github/actions/mypy-cache
        with:
          name: agent-backend
          path: agent/backend/.mypy_cache
          lockfile: agent/backend/uv.lock

      # ruff format / ruff check / mypy / pytest / 検証 evidence の dry-run / release chain の rehearsal / bandit / pip-audit。
      - name: Run backend checks
        run: scripts/check-all.sh
        env:
          SKIP_FRONTEND: "1"
          SKIP_AUDIT: ${{ needs.changes.outputs.agent_deps == 'true' && '0' || '1' }}
          UV_SYNC_ARGS: "--locked --dev"
          # pytest-xdist で runner の CPU 数だけ並列に実行する（#344）。遅いテストの上位 20 件を log に出す（#1591）。
          PYTEST_ARGS: "-n auto --durations=20"

      # main の push だけが保存する（PR は復元だけ。#1589）。
      - name: Save mypy cache
        if: github.ref == 'refs/heads/main' && steps.mypy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: agent/backend/.mypy_cache
          key: ${{ steps.mypy-cache.outputs.key }}

  agent-frontend:
    name: Agent / Frontend
    needs: changes
    if: needs.changes.outputs.agent_frontend == 'true' || needs.changes.outputs.platform_frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent/frontend
    steps:
      # frontend は file:../../platform/packages/ui に依存するため、先に共有 UI を build する。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies and build shared UI
        uses: ./.github/actions/platform-ui
        with:
          frontend: agent/frontend

      - name: Lint
        run: npm run lint

      # e2e の spec・fixture・playwright.config.ts の型検査（tsconfig.e2e.json。Playwright は実行時に型を検査しない。#1591）。
      - name: Type check (e2e)
        run: npm run typecheck:e2e

      # src/lib の純粋な関数の単体テスト（vitest。RAG / Frontend と同じ。#1595）。画面の振る舞いは e2e が確かめる。
      - name: Unit test
        run: npm test

      # 型検査は build の `tsc --noEmit` が兼ねる。
      - name: Build
        run: npm run build

  agent-e2e:
    name: Agent / E2E smoke
    # impact が全件なら飛ばす（RAG / E2E smoke と同じ。#1525）。
    needs: [changes, e2e-impact]
    if: >-
      !cancelled() && needs.changes.result == 'success'
      && (needs.changes.outputs.agent_frontend == 'true' || needs.changes.outputs.platform_frontend == 'true')
      && needs.e2e-impact.outputs.agent_mode != 'full'
    runs-on: ubuntu-24.04
    # 実測は約 2 分（2026-10、2 worker。Playwright は 1.2 分。1 worker では 1.8〜2.0 分。#1489）。
    timeout-minutes: 10
    defaults:
      run:
        working-directory: agent/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies and build shared UI
        uses: ./.github/actions/platform-ui
        with:
          frontend: agent/frontend

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: agent/frontend

      # PR では約 1 分の smoke と、差分に影響を受ける spec（e2e-impact。#885）を実行する（RAG / NL2SQL の #184 と同じ。#339）。
      # ログイン・認証・Run の stream・Runtime の主導線・セキュリティ管理・フォント・設定の契約。
      # 全件（約 100 件）は e2e-nightly.yml が毎晩実行する。retries は workflow の env の E2E_RETRIES（PR は 1。#1593）、worker 数は
      # playwright.config.ts の CI の値（2。spec のファイル単位で並べる。#1489）。
      # spec は workflow の env の AGENT_E2E_SMOKE。
      - name: Playwright E2E (smoke)
        run: |
          # shellcheck disable=SC2086
          npx playwright test $AGENT_E2E_SMOKE

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-playwright-smoke
          path: agent/frontend/test-results
          retention-days: 7

  # ---------------------------------------------------------------- e2e の影響分析（#885）
  #
  # PR の差分に影響を受ける Playwright の spec を選び、製品ごとに shard に分けて実行する。
  # nightly（e2e-nightly.yml）が全件の実行で記録した spec ごとの実行範囲（artifact `e2e-impact-<製品>-<shard>`）と
  # 差分の行を突き合わせる（platform/scripts/e2e_impact.py）。記録が無い・判定できない変更は全件にする。
  # 画面のコードを変えた PR で、その画面を検証する既存の spec が nightly で初めて壊れることを防ぐ。

  # changes を待たずに始める（shard の開始が 15〜30 秒早まる。#1525）。選択の規則は製品の frontend・共有 UI・
  # 記録の仕組みのパスだけを見る（changes の rag / nl2sql / agent / platform_frontend が false の製品は必ず none）ので、
  # PR では常に 3 製品とも select する。何も選ばない製品は nightly の記録を取得しない。
  e2e-impact:
    name: E2E impact / 影響を受ける spec の選択
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      rag_mode: ${{ steps.select.outputs.rag_mode }}
      rag_matrix: ${{ steps.select.outputs.rag_matrix }}
      rag_total: ${{ steps.select.outputs.rag_total }}
      nl2sql_mode: ${{ steps.select.outputs.nl2sql_mode }}
      nl2sql_matrix: ${{ steps.select.outputs.nl2sql_matrix }}
      nl2sql_total: ${{ steps.select.outputs.nl2sql_total }}
      agent_mode: ${{ steps.select.outputs.agent_mode }}
      agent_matrix: ${{ steps.select.outputs.agent_matrix }}
      agent_total: ${{ steps.select.outputs.agent_total }}
    steps:
      # base との差分と、nightly の記録の commit（main の履歴）の両方を使うため全履歴を取る。
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # spec が記録の fixture を通る `test` を使っていること（@playwright/test から直接 import しない）。
      - name: Check e2e imports
        run: python3 platform/scripts/e2e_impact.py check-imports

      # frontend が読む frontend の外のファイルが frontend の job を動かす filter に（#1531）、backend のテストが読む
      # frontend のファイルが backend の job を動かす filter に（#1592）入っていること。
      - name: Check frontend paths in the CI filter
        run: python3 platform/scripts/ci_frontend_paths.py

      # --skip-specs: smoke が全 project で実行する spec（workflow の env の <製品>_E2E_SMOKE）は選ばない（#1525）。
      - name: Select affected specs
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: origin/${{ github.base_ref }}
        run: |
          for product in rag nl2sql agent; do
            smoke="$(echo "${product}" | tr '[:lower:]' '[:upper:]')_E2E_SMOKE"
            python3 platform/scripts/e2e_impact.py select --product "${product}" --base "${BASE}" --download \
              --skip-specs "${!smoke}"
          done

  rag-e2e-impact:
    name: RAG / E2E impact (${{ matrix.shard }}/${{ needs.e2e-impact.outputs.rag_total }})
    needs: e2e-impact
    if: needs.e2e-impact.outputs.rag_mode == 'selected' || needs.e2e-impact.outputs.rag_mode == 'full'
    runs-on: ubuntu-24.04
    # nightly の 1 shard の実測の倍程度（選ぶ shard 数は 1 shard 約 6 分を目安に決める）。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-impact.outputs.rag_matrix) }}
    defaults:
      run:
        working-directory: rag/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies and build shared UI
        uses: ./.github/actions/platform-ui
        with:
          frontend: rag/frontend

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: rag/frontend

      # matrix の specs は e2e_impact.py が nightly の実測の時間で shard に詰めた spec（#1488）。空なら全 spec
      # （記録の無い NL2SQL の全件）。playwright_shard は NL2SQL（fullyParallel）が長い spec をテスト単位で
      # 分けた部分の値（#1525）で、ほかは 1/1。
      # spec のパスは空白区切りで渡す（単語分割を意図している）。worker は config の CI の値（2。#1489）。
      - name: Playwright E2E (affected)
        env:
          SPECS: ${{ matrix.specs }}
          PLAYWRIGHT_SHARD: ${{ matrix.playwright_shard }}
        run: |
          # shellcheck disable=SC2086
          npx playwright test --pass-with-no-tests --shard="$PLAYWRIGHT_SHARD" $SPECS

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rag-playwright-impact-${{ matrix.shard }}
          path: rag/frontend/test-results
          retention-days: 7

  nl2sql-e2e-impact:
    name: NL2SQL / E2E impact (${{ matrix.shard }}/${{ needs.e2e-impact.outputs.nl2sql_total }})
    needs: e2e-impact
    if: needs.e2e-impact.outputs.nl2sql_mode == 'selected' || needs.e2e-impact.outputs.nl2sql_mode == 'full'
    runs-on: ubuntu-24.04
    # nightly の 1 shard の実測の倍程度（選ぶ shard 数は 1 shard 約 6 分を目安に決める）。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-impact.outputs.nl2sql_matrix) }}
    defaults:
      run:
        working-directory: nl2sql/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies and build shared UI
        uses: ./.github/actions/platform-ui
        with:
          frontend: nl2sql/frontend

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: nl2sql/frontend

      # matrix の specs は e2e_impact.py が nightly の実測の時間で shard に詰めた spec（#1488）。空なら全 spec
      # （記録の無い NL2SQL の全件）。playwright_shard は NL2SQL（fullyParallel）が長い spec をテスト単位で
      # 分けた部分の値（#1525）で、ほかは 1/1。
      # spec のパスは空白区切りで渡す（単語分割を意図している）。worker は config の CI の値（2。#1489）。
      - name: Playwright E2E (affected)
        env:
          SPECS: ${{ matrix.specs }}
          PLAYWRIGHT_SHARD: ${{ matrix.playwright_shard }}
        run: |
          # shellcheck disable=SC2086
          npx playwright test --pass-with-no-tests --shard="$PLAYWRIGHT_SHARD" $SPECS

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nl2sql-playwright-impact-${{ matrix.shard }}
          path: nl2sql/frontend/test-results
          retention-days: 7

  agent-e2e-impact:
    name: Agent / E2E impact (${{ matrix.shard }}/${{ needs.e2e-impact.outputs.agent_total }})
    needs: e2e-impact
    if: needs.e2e-impact.outputs.agent_mode == 'selected' || needs.e2e-impact.outputs.agent_mode == 'full'
    runs-on: ubuntu-24.04
    # nightly の 1 shard の実測の倍程度（選ぶ shard 数は 1 shard 約 6 分を目安に決める）。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.e2e-impact.outputs.agent_matrix) }}
    defaults:
      run:
        working-directory: agent/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies and build shared UI
        uses: ./.github/actions/platform-ui
        with:
          frontend: agent/frontend

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-browsers
        with:
          working-directory: agent/frontend

      # matrix の specs は e2e_impact.py が nightly の実測の時間で shard に詰めた spec（#1488）。空なら全 spec
      # （記録の無い NL2SQL の全件）。playwright_shard は NL2SQL（fullyParallel）が長い spec をテスト単位で
      # 分けた部分の値（#1525）で、ほかは 1/1。
      # spec のパスは空白区切りで渡す（単語分割を意図している）。worker は config の CI の値（2。#1489）。
      - name: Playwright E2E (affected)
        env:
          SPECS: ${{ matrix.specs }}
          PLAYWRIGHT_SHARD: ${{ matrix.playwright_shard }}
        run: |
          # shellcheck disable=SC2086
          npx playwright test --pass-with-no-tests --shard="$PLAYWRIGHT_SHARD" $SPECS

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-playwright-impact-${{ matrix.shard }}
          path: agent/frontend/test-results
          retention-days: 7

  # ---------------------------------------------------------------- 配備（init_script.sh・platform/deploy）

  # 1 台の Compute の配備の検証（#1592）。RAG / NL2SQL / Agent の init_script.sh と配備のスクリプト・
  # platform/deploy を 1 つの job で検査する（以前の 4 つの job。中身は suite-deploy.yml）。
  # 製品横断の評価（suite/evaluation。#3240）。製品は公開の MCP の台本（MockTransport）で再生し、実サービスは呼ばない。
  suite-evaluation:
    name: Suite / Evaluation
    needs: changes
    if: needs.changes.outputs.suite_evaluation == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: suite/evaluation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: suite/evaluation/uv.lock
          save-cache: ${{ github.event_name == 'push' }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest -n auto --durations=20

      - name: Security scan
        run: uv run bandit -r src

      - name: Dependency audit
        if: needs.changes.outputs.suite_evaluation_deps == 'true'
        run: uv run pip-audit --skip-editable

  suite-deploy:
    name: Suite / Deploy
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    uses: ./.github/workflows/suite-deploy.yml

  # 本番の Compute の OS（Oracle Linux 9。#1611）で、配備のスクリプトが dnf で入れる package の名前（依存まで
  # 解決し、入れない）・前提の command・bash -n を確かめ、platform/deploy のテストも Oracle Linux の bash で実行する。
  # GitHub に Oracle Linux の runner は無いため、ubuntu-24.04 の上の container で動かす。SELinux・systemd は
  # container で動かないため、実機の確認は手動で行う（PR の手順）。reverse proxy（Nginx）と TLS は配備しない（#19）。
  suite-oracle-linux:
    name: Suite / Oracle Linux 9
    needs: changes
    if: needs.changes.outputs.deploy_os == 'true'
    runs-on: ubuntu-24.04
    container: oraclelinux:9
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check packages and commands on Oracle Linux 9
        run: bash platform/deploy/tests/oracle-linux.test.sh

      # テストは root 以外のユーザーで実行する（runner の Ubuntu と同じ条件）。
      - name: Test single-Compute deployment on Oracle Linux 9 (platform/deploy)
        run: |
          dnf -y -q install util-linux procps-ng diffutils findutils
          useradd --create-home pr-ci
          chmod -R a+rX "${GITHUB_WORKSPACE}"
          runuser -u pr-ci -- bash platform/deploy/tests/suite-init.test.sh

  # ---------------------------------------------------------------- root の scripts/

  # monorepo の開発の補助のスクリプト（setup-worktree.sh・pr-merge-check.sh・check-agents-md-size.sh・third-party-notices.py。#1328・#2276・#3392）を shellcheck と、
  # 偽の gh・一時的な git リポジトリのテスト（scripts/tests/）で検査する。テストは GitHub に接続しない。
  # .github/ の workflow（actionlint。run の script は shellcheck も通す）と .github/scripts も検査する（#1525）。
  # workflow の安全の検査（zizmor。設定は .github/zizmor.yml。#1594）も行う。
  suite-scripts:
    name: Suite / Scripts
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck は GitHub の ubuntu の runner に入っている。
      - name: Shellcheck
        run: shellcheck scripts/*.sh scripts/tests/*.sh .github/scripts/*.sh .github/actions/*/*.sh

      - name: Test pr-merge-check
        run: bash scripts/tests/pr-merge-check.test.sh

      # 実 Oracle の結合テストの skip の監視（oracle-integration.yml。#1595）。runner の python3 で動く。
      - name: Test pytest-skip-gate
        run: bash scripts/tests/pytest-skip-gate.test.sh

      # Playwright の OS の依存を、時間の上限と retry を付けて入れる script（.github/actions/playwright-browsers。#3489）。
      - name: Test playwright-browsers install
        run: bash scripts/tests/playwright-install.test.sh

      # AGENTS.md の大きさ（直下は 20 KiB、直下と各ディレクトリの AGENTS.md の合計は 32 KiB まで。#2276）。
      # Codex は合計が project_doc_max_bytes（既定 32 KiB）を超えた分を読まない。
      - name: Check AGENTS.md size
        run: bash scripts/check-agents-md-size.sh

      - name: Test check-agents-md-size
        run: bash scripts/tests/check-agents-md-size.test.sh

      # THIRD-PARTY-NOTICES.md の表と、git が管理する uv.lock / package-lock.json の依存を突き合わせる（#3392）。
      # 表の部品が依存から外れたとき、npm に permissive でないライセンスの package が増えて表に無いときに失敗する。
      - name: Check third-party notices
        run: python3 scripts/third-party-notices.py check

      - name: Test third-party-notices
        run: bash scripts/tests/third-party-notices.test.sh

      # 版を固定し、release の checksum で確かめてから使う。shellcheck は runner のものを使う。
      - name: Actionlint
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: "1.7.12"
        run: |
          dir="${RUNNER_TEMP}/actionlint"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          gh release download "v${ACTIONLINT_VERSION}" --repo rhysd/actionlint --dir "${dir}" \
            --pattern "${archive}" --pattern "actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          (cd "${dir}" && sha256sum --check --ignore-missing "actionlint_${ACTIONLINT_VERSION}_checksums.txt" \
            && tar -xzf "${archive}" actionlint)
          "${dir}/actionlint" -color

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      # workflow・composite action・dependabot.yml の安全の検査（#1594。action の SHA の固定・token の権限・
      # 危険な trigger・template の injection など）。版を固定し、設定と除外の理由は .github/zizmor.yml。
      # --offline は GitHub の API を使う検査（action の版の照合など）をしない。
      - name: Zizmor
        env:
          ZIZMOR_VERSION: "1.30.1"
        run: uvx "zizmor@${ZIZMOR_VERSION}" --offline --format github --config .github/zizmor.yml .

  # ---------------------------------------------------------------- 集約

  # job を追加したら、この needs にも追加する（ここに無い job の失敗は CI OK に反映されない）。
  # すべての job に timeout-minutes を付ける（通常 10〜15 分、e2e は実測の倍程度。既定の 360 分のまま止まると
  # runner と PR の待ちを長く塞ぐ）。
  # 実 Oracle の結合テスト（Oracle AI Database Free。#1595）。その製品の DB の層（changes の <製品>_oracle）が
  # 変わったときだけ実行する（それ以外の PR では実行しない）。3 製品の全件は integration-nightly.yml が毎晩。
  # job の timeout-minutes は呼び出し先（oracle-integration.yml）にある。
  rag-oracle:
    name: RAG / Oracle
    needs: changes
    if: needs.changes.outputs.rag_oracle == 'true'
    uses: ./.github/workflows/oracle-integration.yml
    with:
      product: rag

  nl2sql-oracle:
    name: NL2SQL / Oracle
    needs: changes
    if: needs.changes.outputs.nl2sql_oracle == 'true'
    uses: ./.github/workflows/oracle-integration.yml
    with:
      product: nl2sql

  agent-oracle:
    name: Agent / Oracle
    needs: changes
    if: needs.changes.outputs.agent_oracle == 'true'
    uses: ./.github/workflows/oracle-integration.yml
    with:
      product: agent

  ci-ok:
    name: CI OK
    if: always()
    needs:
      - changes
      - secret-scan
      - dependency-review
      - platform-ui
      - platform-backend-core
      - platform-system-settings-backend
      - platform-evaluation-scoring
      - platform-enterprise-ai
      - rag-backend
      - rag-engine
      - services-scripts-lint
      - rag-parser-docling
      - rag-frontend
      - rag-e2e
      - nl2sql-frontend
      - nl2sql-e2e
      - nl2sql-backend
      - agent-backend
      - agent-frontend
      - agent-e2e
      - e2e-impact
      - rag-e2e-impact
      - nl2sql-e2e-impact
      - agent-e2e-impact
      - suite-deploy
      - suite-oracle-linux
      - suite-scripts
      - suite-evaluation
      - rag-oracle
      - nl2sql-oracle
      - agent-oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # skip（変更のない製品）は成功扱い。failure / cancelled が1つでもあれば失敗させる。
      - name: Check results
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: ${RESULTS}"
          if echo "${RESULTS}" | grep -Eq '"(failure|cancelled)"'; then
            echo "::error::失敗または中断された job があります。"
            exit 1
          fi
