[project]
name = "production-ready-assistant-evaluation"
version = "0.1.0"
description = "Cross-product evaluation CLI of the No.1 Production Ready suite: runs an evaluation dataset against a product through its public MCP contract and scores the saved observations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
# 依存は platform の公開の package と、MCP を呼ぶ HTTP・入出力の検証だけ（製品の package は入れない。#3240）。
dependencies = [
  "httpx==0.28.1",
  "pydantic>=2.11",
  "production-ready-evaluation-scoring",
  # LLM による判定のモデルの API の呼び方（URL の規則・HTTP の失敗の分類）を 3 製品と共有する
  # （標準 library だけの platform の package。FastAPI を入れない。#3418）。
  "production-ready-enterprise-ai",
  # 人手の判定の記入用の Excel のブック（label-template / label-import。#3418）。
  "openpyxl>=3.1",
]

[project.scripts]
suite-evaluation = "pr_suite_evaluation.cli:main"

[tool.uv.sources]
production-ready-evaluation-scoring = { path = "../../platform/packages/evaluation_scoring", editable = true }
production-ready-enterprise-ai = { path = "../../platform/packages/enterprise_ai", editable = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-xdist>=3.8",
  "pytest-timeout>=2.3",
  "ruff>=0.9",
  "mypy>=1.14",
  "bandit>=1.8",
  "pip-audit>=2.9",
  "types-openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_suite_evaluation"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# 整形（#345）。black と同じ既定にそろえる。
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 1 つのテストが止まったら 120 秒で失敗にする（pytest-timeout。#1591）。
timeout = 120
